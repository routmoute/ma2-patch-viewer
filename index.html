<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MA2 Patch Viewer</title>
  <style>
/* ════════════════════════════════════════════
   VARIABLES & RESET
════════════════════════════════════════════ */
:root {
  --app-bg:     #0d1b2a;
  --app-accent: #f0c040;
  --app-border: #1e3a56;
  --app-card:   rgba(255,255,255,0.04);
  --app-text:   #c8d0d8;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }


/* ════════════════════════════════════════════
   DROP ZONE SCREEN
════════════════════════════════════════════ */
#screen-drop {
  min-height: 100vh;
  background: var(--app-bg);
  color: var(--app-text);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 20px;
  gap: 0;
}

.drop-header { text-align: center; margin-bottom: 32px; }
.drop-header h1 {
  font-size: 26px;
  font-weight: 800;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--app-accent);
}
.drop-header p {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  opacity: 0.4;
  margin-top: 6px;
}

#drop-zone {
  border: 2px dashed var(--app-border);
  border-radius: 16px;
  width: 100%;
  max-width: 500px;
  padding: 56px 32px;
  text-align: center;
  cursor: pointer;
  background: var(--app-card);
  position: relative;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
  user-select: none;
}
#drop-zone:hover, #drop-zone:focus {
  border-color: var(--app-accent);
  background: rgba(240,192,64,0.06);
}
@keyframes pulse-border {
  0%, 100% { border-color: var(--app-accent); }
  50%       { border-color: rgba(240,192,64,0.35); }
}
#drop-zone.drag-over {
  animation: pulse-border 0.8s ease infinite;
  background: rgba(240,192,64,0.08);
}
.dz-icon {
  font-size: 48px;
  margin-bottom: 14px;
  display: block;
  transition: transform 0.2s;
}
#drop-zone:hover .dz-icon { transform: scale(1.1) translateY(-4px); }
.dz-main  { font-size: 15px; font-weight: 600; color: #ccc; margin-bottom: 6px; }
.dz-hint  { font-size: 11px; opacity: 0.4; }
.dz-badge {
  display: inline-block;
  margin-top: 18px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 4px 14px;
  border-radius: 12px;
  font-size: 11px;
  font-family: 'Courier New', monospace;
  color: var(--app-accent);
  letter-spacing: 0.5px;
}
#file-input { display: none; }

/* Error */
#error-box { max-width: 500px; width: 100%; margin-top: 14px; min-height: 20px; }
.err-msg {
  background: rgba(192,57,43,0.15);
  border: 1px solid rgba(192,57,43,0.4);
  color: #f1948a;
  padding: 10px 16px;
  border-radius: 8px;
  font-size: 12px;
  text-align: center;
}

/* Logo panel */
.logo-panel {
  margin-top: 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.lp-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  opacity: 0.35;
}
#btn-logo {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  color: #aaa;
  padding: 8px 20px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 12px;
  font-family: inherit;
  transition: all 0.2s;
}
#btn-logo:hover { background: rgba(255,255,255,0.12); color: #fff; }
#logo-input { display: none; }

.logo-status {
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 44px;
}
#logo-preview {
  max-height: 40px;
  max-width: 160px;
  border-radius: 4px;
  display: none;
  opacity: 0.85;
}
#logo-fname { font-size: 10px; color: #777; display: none; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#btn-rm-logo {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.15);
  color: #777;
  width: 22px; height: 22px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 10px;
  display: none;
  align-items: center;
  justify-content: center;
  line-height: 1;
  font-family: inherit;
}
#btn-rm-logo:hover { border-color: #f1948a; color: #f1948a; }


/* ════════════════════════════════════════════
   TOOLBAR
════════════════════════════════════════════ */
.toolbar {
  position: sticky;
  top: 0;
  z-index: 200;
  background: var(--app-bg);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  box-shadow: 0 2px 14px rgba(0,0,0,0.4);
}
.t-brand {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--app-accent);
}
.t-file  { font-size: 11px; color: #556; font-style: italic; }
.t-spacer { flex: 1; }
.btn-back {
  background: transparent;
  border: 1px solid #2a3a4a;
  color: #778;
  padding: 7px 16px;
  border-radius: 18px;
  cursor: pointer;
  font-size: 11px;
  font-family: inherit;
  transition: all 0.2s;
}
.btn-back:hover { border-color: #557; color: #ccc; }
.btn-print {
  background: var(--app-accent);
  border: none;
  color: #1a1200;
  padding: 8px 22px;
  border-radius: 18px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 700;
  font-family: inherit;
  transition: background 0.2s;
}
.btn-print:hover { background: #ffd060; }

/* Output wrapper */
#patch-output {
  background: #e0e4ea;
  padding: 28px;
  min-height: calc(100vh - 50px);
}


/* ════════════════════════════════════════════
   PATCH SHEET — PAGE
════════════════════════════════════════════ */
.page {
  background: #fff;
  max-width: 960px;
  margin: 0 auto;
  border-radius: 6px;
  overflow: hidden;
  box-shadow: 0 4px 28px rgba(0,0,0,0.2);
}

/* Header */
.page-header {
  background: #0d1b2a;
  color: #fff;
  padding: 18px 26px;
  display: flex;
  align-items: center;
  gap: 20px;
}
.logo-img {
  max-height: 60px;
  max-width: 190px;
  object-fit: contain;
  flex-shrink: 0;
}
.header-mid { flex: 1; }
.header-mid h1 {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: 4px;
}
.header-mid .tagline {
  font-size: 9.5px;
  opacity: 0.5;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-top: 3px;
}
.page-header .meta { text-align: right; }
.meta .showname {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #f0c040;
}
.meta .detail { font-size: 9.5px; opacity: 0.6; margin-top: 2px; }

/* Universe bar */
.uni-bar {
  display: flex;
  background: #f4f6f9;
  border-bottom: 2px solid #dde2ea;
}
.uni-card {
  flex: 1;
  padding: 10px 18px;
  border-left: 5px solid transparent;
  border-right: 1px solid #e0e4ea;
}
.uni-card:last-child { border-right: none; }
.uni-card.u1 { border-left-color: #e67e22; }
.uni-card.u2 { border-left-color: #2980b9; }
.uni-card.u3 { border-left-color: #27ae60; }
.uni-card.u4 { border-left-color: #8e44ad; }
.uni-card.u5 { border-left-color: #c0392b; }
.uni-card.u6 { border-left-color: #17a589; }
.u-num  { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: #aaa; font-weight: 700; margin-bottom: 2px; }
.u-title { font-size: 12px; font-weight: 700; color: #1a1a2e; }
.u-detail { font-size: 9px; color: #bbb; margin-top: 2px; font-family: 'Courier New', monospace; }

/* Content */
.content { padding: 20px 26px 28px; }

/* Layer */
.layer { margin-bottom: 28px; }
.layer-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 9px;
  padding-bottom: 6px;
  border-bottom: 2px solid #eee;
}
.layer-badge {
  font-size: 9px;
  font-weight: 700;
  color: #fff;
  padding: 2px 10px;
  border-radius: 10px;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.layer-name   { font-size: 14px; font-weight: 700; color: #1a1a2e; }
.layer-info   { margin-left: auto; font-size: 9.5px; color: #bbb; }

/* Table */
.patch-table {
  width: 100%;
  border-collapse: collapse;
  border: 1px solid #e4e8ee;
  border-radius: 5px;
  overflow: hidden;
}
.patch-table thead tr { background: #f2f4f7; }
.patch-table th {
  padding: 6px 9px;
  text-align: left;
  font-size: 8.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #999;
  border-bottom: 2px solid #dde2ea;
  white-space: nowrap;
}
.patch-table th.tc { text-align: center; }
.patch-table td {
  padding: 5px 9px;
  border-bottom: 1px solid #f0f2f5;
  vertical-align: middle;
  font-size: 11px;
}
.patch-table tbody tr:last-child td { border-bottom: none; }
.patch-table tbody tr:nth-child(even) { background: #fafbfc; }
.patch-table tr.g-sep td {
  border-top: 2px solid #dde2ea !important;
  background: #f7f9fb !important;
}

/* Cells */
.c-fixid { font-size: 9px; color: #ccc; font-family: 'Courier New', monospace; width: 52px; }
.c-channel { font-size: 13px; font-weight: 800; color: #1a1a2e; width: 52px; }
.c-name    { font-weight: 600; color: #1a1a2e; }
.c-subname { font-size: 9px; color: #aaa; margin-top: 1px; }
.c-type    { color: #aaa; font-style: italic; font-size: 10px; }
.tc      { text-align: center; }

/* Universe chip */
.chip {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 8px;
  font-size: 8.5px;
  font-weight: 700;
  font-family: 'Courier New', monospace;
  white-space: nowrap;
}
.chip.u1 { background: #fff3cd; color: #7a4f00; }
.chip.u2 { background: #d0e8ff; color: #0b3a78; }
.chip.u3 { background: #d1f0e0; color: #0b4a22; }
.chip.u4 { background: #f3e5f5; color: #4a0a50; }
.chip.u5 { background: #fce4ec; color: #4a0a18; }
.chip.u6 { background: #e0f7f5; color: #006054; }

/* DMX address */
.addr-main { font-family: 'Courier New', monospace; font-size: 13px; font-weight: 700; color: #1a1a2e; }
.addr-end  { font-family: 'Courier New', monospace; font-size: 11px; color: #aaa; }
.addr-sub  { font-family: 'Courier New', monospace; font-size: 9px; color: #bbb; display: block; margin-top: 1px; }

/* Channel bar */
.ch-wrap { display: flex; align-items: center; gap: 5px; }
.ch-num  { font-family: 'Courier New', monospace; font-size: 11px; font-weight: 700; min-width: 22px; }
.ch-bar  { height: 6px; border-radius: 3px; opacity: 0.6; }
.ch-fine { font-size: 9px; color: #aaa; margin-top: 1px; }

/* Segment pill */
.seg-pill {
  display: inline-block;
  padding: 1px 7px;
  border-radius: 6px;
  font-size: 8.5px;
  color: #777;
  background: #ececec;
  white-space: nowrap;
}

/* Footer */
.page-footer {
  background: #f4f6f9;
  border-top: 1px solid #dde2ea;
  padding: 8px 26px;
  display: flex;
  justify-content: space-between;
  font-size: 8.5px;
  color: #bbb;
}


/* ════════════════════════════════════════════
   PRINT
════════════════════════════════════════════ */
@media print {
  body { background: #fff; }
  #screen-drop   { display: none !important; }
  .toolbar       { display: none !important; }
  #screen-result { display: block !important; }
  #patch-output  { background: #fff !important; padding: 0 !important; min-height: unset !important; }
  .page          { box-shadow: none; border-radius: 0; max-width: 100%; }
  .layer         { page-break-inside: avoid; }
  .patch-table tbody tr:nth-child(even) { background: #f9f9f9 !important; }
  .patch-table thead tr { background: #efefef !important; }
  .uni-card, .layer-badge, .chip, .ch-bar, .page-header, .uni-bar {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  @page { margin: 12mm 14mm; size: A4; }
}
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════
     SCREEN 1 — DROP ZONE
══════════════════════════════════════════ -->
<div id="screen-drop">

  <div class="drop-header">
    <h1>MA2 Patch Viewer</h1>
    <p>grandMA2 XML → Printable patch sheet</p>
  </div>

  <div id="drop-zone" tabindex="0" role="button" aria-label="XML file drop zone">
    <span class="dz-icon">📋</span>
    <div class="dz-main">Drop the XML file here</div>
    <div class="dz-hint">or click to browse</div>
    <span class="dz-badge">.xml — grandMA2 Patch Export</span>
    <input type="file" id="file-input" accept=".xml" aria-hidden="true">
  </div>

  <div id="error-box"></div>

  <div class="logo-panel">
    <span class="lp-label">Logo on the patch sheet</span>
    <button id="btn-logo">📷&nbsp; Upload logo</button>
    <input type="file" id="logo-input" accept="image/png,image/jpeg,image/webp,image/svg+xml" aria-hidden="true">
    <div class="logo-status">
      <img id="logo-preview" alt="Logo preview">
      <span id="logo-fname"></span>
      <button id="btn-rm-logo" title="Remove logo">✕</button>
    </div>
  </div>

</div>


<!-- ══════════════════════════════════════════
  SCREEN 2 — RESULT
══════════════════════════════════════════ -->
<div id="screen-result" style="display:none">
  <div class="toolbar">
    <span class="t-brand">MA2 Patch Viewer</span>
    <span class="t-file" id="t-filename"></span>
    <span class="t-spacer"></span>
    <button class="btn-back"  id="btn-back">← New file</button>
    <button class="btn-print" id="btn-print">🖨&nbsp; Print / PDF</button>
  </div>
  <div id="patch-output"></div>
</div>


<!-- ══════════════════════════════════════════
    JAVASCRIPT
══════════════════════════════════════════ -->
<script>
'use strict';

/* ─── constants ─── */
const LOGO_KEY     = 'ma2pv_logo_v1';
const LAYER_COLORS = ['#c0392b','#2471a3','#7d3c98','#1a7a44','#d35400','#117a65','#1a5276','#922b21'];

/* ─── tiny helpers ─── */
const $   = id => document.getElementById(id);
const esc = s  => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ─── XML DOM helpers (namespace-safe, works with MA2's default namespace) ─── */
function ch(el, tag)  { return Array.from(el.children).find(c => c.localName === tag) ?? null; }
function chs(el, tag) { return Array.from(el.children).filter(c => c.localName === tag); }
function desc(el, tag) {
  const out = [];
  (function walk(node) {
    for (const c of node.children) {
      if (c.localName === tag) out.push(c);
      walk(c);
    }
  })(el);
  return out;
}

/* ─── math ─── */
const uniNum  = addr => Math.ceil(addr / 512);
const uniChan = addr => ((addr - 1) % 512) + 1;
const pad3    = n    => String(n).padStart(3, '0');

function fmtDate(iso) {
  try { return new Date(iso).toLocaleDateString('en-US', { day:'numeric', month:'long', year:'numeric' }); }
  catch { return iso?.slice(0, 10) ?? ''; }
}

/* ─── layer color ─── */
function layerColor(idx) {
  return LAYER_COLORS[idx % LAYER_COLORS.length];
}

/* ─── fixture stats ─── */
function fixStats(fix) {
  const subs = fix.subfixtures;
  if (!subs.length) return null;
  const first = subs[0];
  const last  = subs[subs.length - 1];
  const isMulti = subs.length > 1;
  const gap   = isMulti
    ? (subs.length > 1 ? subs[1].address - subs[0].address : first.channels)
    : (fix.dmxFootprint || first.channels);
  const start = first.address;
  const end   = isMulti ? last.address + gap - 1 : first.address + gap - 1;
  const uni   = uniNum(start);
  return {
    startAddr: start,
    endAddr:   end,
    totalCh:   end - start + 1,
    paramCh:   isMulti ? subs.length * gap : first.channels,
    uni,
    relStart:  uniChan(start),
    relEnd:    uniChan(end),
    numSubs:   subs.length,
    isMulti
  };
}

/* ════════════════════════════════════════════
   MA2 XML PARSER
════════════════════════════════════════════ */
function parseMA2(xmlText) {
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');

  if (doc.querySelector('parsererror'))
    throw new Error('Invalid or corrupted XML file.');

  const root = doc.documentElement;

  // Show info
  const infoEl  = desc(root, 'Info')[0];
  const showInfo = {
    showfile: infoEl?.getAttribute('showfile') ?? 'show',
    datetime: infoEl?.getAttribute('datetime') ?? ''
  };

  // Layers & Fixtures
  const layers = [];
  for (const layerEl of desc(root, 'Layer')) {
    const fixtures = [];

    for (const fixEl of chs(layerEl, 'Fixture')) {
      const ftEl  = desc(fixEl, 'FixtureType')[0];
      const type  = (ftEl?.getAttribute('name') ?? '').replace(/^\d+\s+/, ''); // strip leading "N "

      const subfixtures = [];
      for (const sfEl of chs(fixEl, 'SubFixture')) {
        const patchEl = ch(sfEl, 'Patch');
        if (!patchEl) continue;
        const addrEl  = ch(patchEl, 'Address');
        if (!addrEl)  continue;
        const addr    = parseInt(addrEl.textContent.trim(), 10);
        if (!addr || isNaN(addr)) continue;
        subfixtures.push({ address: addr, channels: chs(sfEl, 'Channel').length });
      }
      if (!subfixtures.length) continue; // skip unpatched

      fixtures.push({
        fixture_id: fixEl.getAttribute('fixture_id') ?? '',
        channel_id: fixEl.getAttribute('channel_id') ?? null,
        name:       fixEl.getAttribute('name') ?? '',
        type,
        subfixtures
      });
    }

    if (!fixtures.length) continue;
    // Calculate the actual DMX footprint from the address gap between consecutive fixtures.
    const sfx = fixtures
      .filter(f => f.subfixtures.length === 1)
      .sort((a, b) => a.subfixtures[0].address - b.subfixtures[0].address);
    for (let i = 0; i < sfx.length - 1; i++) {
      const gap = sfx[i+1].subfixtures[0].address - sfx[i].subfixtures[0].address;
      if (gap > 0 && gap < 256) sfx[i].dmxFootprint = gap;
    }
    // For the final fixture of each type, reuse the footprint from matching fixtures.
    const fpByType = {};
    sfx.forEach(f => { if (f.dmxFootprint) fpByType[f.type] = f.dmxFootprint; });
    sfx.forEach(f => { if (!f.dmxFootprint && fpByType[f.type]) f.dmxFootprint = fpByType[f.type]; });
    layers.push({
      index:    parseInt(layerEl.getAttribute('index'), 10) || layers.length + 1,
      name:     layerEl.getAttribute('name') ?? `Layer ${layers.length + 1}`,
      fixtures
    });
  }

  if (!layers.length)
    throw new Error('No layer containing patched fixtures was found in this file.');

  return { showInfo, layers };
}

/* ════════════════════════════════════════════
   RENDERERS
════════════════════════════════════════════ */

/* Universe summary bar data */
function buildUniData(layers) {
  const unis = {};
  for (const layer of layers)
    for (const fix of layer.fixtures) {
      const s = fixStats(fix);
      if (!s) continue;
      if (!unis[s.uni]) unis[s.uni] = { names: new Set(), minCh: 9999, maxCh: 0 };
      unis[s.uni].names.add(layer.name);
      unis[s.uni].minCh = Math.min(unis[s.uni].minCh, s.relStart);
      unis[s.uni].maxCh = Math.max(unis[s.uni].maxCh, s.relEnd);
    }
  return Object.entries(unis)
    .sort(([a], [b]) => +a - +b)
    .map(([num, d]) => ({
      num:    +num,
      name:   [...d.names].join(' · '),
      detail: `Channels ${pad3(d.minCh)} – ${pad3(d.maxCh)}`
    }));
}

/* Name-based group key (strip trailing number) for row separators */
function nameGroup(name) {
  return (name || '').replace(/\s*\d+\s*$/, '').trim();
}

/* Single table row */
function renderRow(fix, s, color, hasChId, isGroupSep) {
  const multi = s?.isMulti ?? false;
  const bar   = s ? Math.round(Math.min(s.totalCh / 40 * 80, 80)) : 0;

  let addrCell;
  if (!s) {
    addrCell = '<td>—</td>';
  } else if (s.totalCh > 1) {
    addrCell = `<td>
      <span class="addr-main">${pad3(s.relStart)}</span><span class="addr-end"> → ${pad3(s.relEnd)}</span>
    </td>`;
  } else {
    addrCell = `<td><span class="addr-main">${pad3(s.relStart)}</span></td>`;
  }

  const mainLabel = fix.name;
  const subLabel  = fix.type;

  return `<tr${isGroupSep ? ' class="g-sep"' : ''}>
    <td class="c-fixid">${esc(fix.fixture_id)}</td>
    ${hasChId ? `<td class="c-channel">${esc(fix.channel_id ?? '—')}</td>` : ''}
    <td><div class="c-name">${esc(mainLabel)}</div>${subLabel ? `<div class="c-subname">${esc(subLabel)}</div>` : ''}</td>
    <td class="tc">${s ? `<span class="chip u${s.uni}">U${s.uni}</span>` : '—'}</td>
    ${addrCell}
    <td class="tc">${multi ? `<span class="seg-pill">${s.numSubs}&nbsp;inst.</span>` : ''}</td>
    <td>
      <div class="ch-wrap">
        <span class="ch-num">${s ? s.totalCh : '—'}</span>
        ${s ? `<div class="ch-bar" style="width:${bar}px;background:${color}"></div>` : ''}
      </div>
      ${s && !s.isMulti && s.totalCh > s.paramCh ? `<div class="ch-fine">${s.paramCh}&nbsp;param.</div>` : ''}
    </td>
  </tr>`;
}

/* Full layer section */
function renderLayer(layer, idx) {
  const color   = layerColor(idx);
  const hasChId = layer.fixtures.some(f => f.channel_id !== null);

  let lastGroup = null;
  const rows = layer.fixtures.map((fix, fi) => {
    const s   = fixStats(fix);
    const grp = nameGroup(fix.name);
    const sep = fi > 0 && grp !== lastGroup;
    lastGroup = grp;
    return renderRow(fix, s, color, hasChId, sep);
  }).join('');

  const stats  = layer.fixtures.map(f => fixStats(f)).filter(Boolean);
  const uniStr = [...new Set(stats.map(s => `Universe ${s.uni}`))].join(', ');

  return `
<div class="layer">
  <div class="layer-header">
    <span class="layer-badge" style="background:${color}">Layer ${layer.index}</span>
    <span class="layer-name">${esc(layer.name)}</span>
    <span class="layer-info">${layer.fixtures.length} fixture${layer.fixtures.length > 1 ? 's' : ''} &nbsp;·&nbsp; ${uniStr}</span>
  </div>
  <table class="patch-table">
    <thead><tr>
      <th>Fix. ID</th>
      ${hasChId ? '<th>Channel</th>' : ''}
      <th>${hasChId ? 'Name' : 'Profile'}</th>
      <th class="tc">Univ.</th>
      <th>DMX Address</th>
      <th class="tc">Instances</th>
      <th>Channels</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>
</div>`;
}

/* Complete patch sheet HTML */
function renderPatch(data, logoUrl) {
  const { showInfo, layers } = data;
  const date     = showInfo.datetime ? fmtDate(showInfo.datetime) : '';
  const totalFix = layers.reduce((a, l) => a + l.fixtures.length, 0);
  const allStats = layers.flatMap(l => l.fixtures.map(f => fixStats(f))).filter(Boolean);
  const uniSet   = new Set(allStats.map(s => s.uni));
  const totalCh     = allStats.reduce((a, s) => a + s.totalCh, 0);
  const totalParams  = allStats.reduce((a, s) => a + s.paramCh, 0);
  const uniData  = buildUniData(layers);

  return `
<div class="page">

  <div class="page-header">
    ${logoUrl ? `<img src="${esc(logoUrl)}" class="logo-img" alt="Logo">` : ''}
    <div class="header-mid">
      <h1>PATCH SHEET</h1>
      <div class="tagline">grandMA2 &nbsp;·&nbsp; DMX Universe Map</div>
    </div>
    <div class="meta">
      <div class="showname">${esc(showInfo.showfile.toUpperCase())}</div>
      ${date ? `<div class="detail">${esc(date)}</div>` : ''}
      <div class="detail">${totalFix} fixture${totalFix > 1 ? 's' : ''} &nbsp;·&nbsp; ${layers.length} layer${layers.length > 1 ? 's' : ''} &nbsp;·&nbsp; ${uniSet.size} DMX universe${uniSet.size > 1 ? 's' : ''}</div>
    </div>
  </div>

  <div class="uni-bar">
    ${uniData.map(u => `
    <div class="uni-card u${u.num}">
      <div class="u-num">Universe ${u.num}</div>
      <div class="u-title">${esc(u.name)}</div>
      <div class="u-detail">${esc(u.detail)}</div>
    </div>`).join('')}
  </div>

  <div class="content">
    ${layers.map((l, i) => renderLayer(l, i)).join('')}
  </div>

  <div class="page-footer">
    <span>grandMA2 &nbsp;·&nbsp; ${esc(showInfo.showfile)}${date ? ' &nbsp;·&nbsp; ' + esc(date) : ''}</span>
    <span>${totalFix} fixture${totalFix > 1 ? 's' : ''} &nbsp;·&nbsp; ${totalParams} GMA2 params &nbsp;·&nbsp; ${totalCh} DMX channels</span>
  </div>

</div>`;
}

/* ════════════════════════════════════════════
   LOGO MANAGEMENT
════════════════════════════════════════════ */
function applyLogoUI(dataUrl, name) {
  $('logo-preview').src           = dataUrl;
  $('logo-preview').style.display = 'block';
  $('logo-fname').textContent     = name || 'Saved logo';
  $('logo-fname').style.display   = 'inline';
  $('btn-rm-logo').style.display  = 'inline-flex';
}
function resetLogoUI() {
  $('logo-preview').src           = '';
  $('logo-preview').style.display = 'none';
  $('logo-fname').textContent     = '';
  $('logo-fname').style.display   = 'none';
  $('btn-rm-logo').style.display  = 'none';
}

/* ════════════════════════════════════════════
   FILE PROCESSING
════════════════════════════════════════════ */
function processFile(file) {
  clearErr();
  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.xml')) {
    showErr('This is not an .xml file. Export the patch from grandMA2 in XML format.'); return;
  }
  const reader = new FileReader();
  reader.onerror = () => showErr('Unable to read the file.');
  reader.onload  = e => {
    try {
      const data = parseMA2(e.target.result);
      const logo = (() => { try { return localStorage.getItem(LOGO_KEY); } catch { return null; } })();
      $('patch-output').innerHTML      = renderPatch(data, logo);
      $('t-filename').textContent      = file.name;
      $('screen-drop').style.display   = 'none';
      $('screen-result').style.display = 'block';
      window.scrollTo(0, 0);
    } catch (err) { showErr(err.message); }
  };
  reader.readAsText(file, 'utf-8');
}

function showErr(msg) { $('error-box').innerHTML = `<div class="err-msg">⚠&nbsp; ${esc(msg)}</div>`; }
function clearErr()   { $('error-box').innerHTML = ''; }

/* ════════════════════════════════════════════
   INIT
════════════════════════════════════════════ */
(function init() {
  const dz = $('drop-zone');
  const fi = $('file-input');

  /* ── Drop zone ── */
  dz.addEventListener('click',   () => fi.click());
  dz.addEventListener('keydown', e  => { if (e.key === 'Enter' || e.key === ' ') fi.click(); });

  dz.addEventListener('dragover',  e => { e.preventDefault(); dz.classList.add('drag-over'); });
  dz.addEventListener('dragleave', ()=> dz.classList.remove('drag-over'));
  dz.addEventListener('drop', e => {
    e.preventDefault();
    dz.classList.remove('drag-over');
    processFile(e.dataTransfer.files[0]);
  });

  fi.addEventListener('change', e => { processFile(e.target.files[0]); e.target.value = ''; });

  /* ── Toolbar buttons ── */
  $('btn-back').addEventListener('click', () => {
    $('screen-result').style.display = 'none';
    $('screen-drop').style.display   = 'flex';
    fi.value = '';
  });
  $('btn-print').addEventListener('click', () => window.print());

  /* ── Logo ── */
  const li = $('logo-input');
  $('btn-logo').addEventListener('click', () => li.click());

  li.addEventListener('change', e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (f.size > 3 * 1024 * 1024) {
      alert('Image is too large (3 MB maximum). Please compress it first.'); return;
    }
    const r = new FileReader();
    r.onload = ev => {
      try { localStorage.setItem(LOGO_KEY, ev.target.result); } catch { /* quota exceeded */ }
      applyLogoUI(ev.target.result, f.name);
    };
    r.readAsDataURL(f);
  });

  $('btn-rm-logo').addEventListener('click', () => {
    try { localStorage.removeItem(LOGO_KEY); } catch {}
    resetLogoUI();
  });

  /* ── Restore saved logo ── */
  try {
    const saved = localStorage.getItem(LOGO_KEY);
    if (saved) applyLogoUI(saved, '');
  } catch {}

})();
</script>
</body>
</html>
